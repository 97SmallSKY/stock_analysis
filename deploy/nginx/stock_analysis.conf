upstream stock_analysis_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;

    # 前端静态包（W7 之后）
    root /home/xiaotian/stock_analysis/frontend/dist;
    index index.html;

    # 代理 API
    location /api/ {
        proxy_pass http://stock_analysis_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket (盘中推送)
    location /ws/ {
        proxy_pass http://stock_analysis_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 健康检查端点直通
    location = /healthz {
        proxy_pass http://stock_analysis_api;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 日志
    access_log /var/log/nginx/stock_analysis.access.log;
    error_log  /var/log/nginx/stock_analysis.error.log;
}
