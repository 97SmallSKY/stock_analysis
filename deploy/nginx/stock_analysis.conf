# stock_analysis nginx 站点配置
#
# 功能:
#   - 静态前端: /home/xiaotian/stock_analysis/frontend/dist (vite build 产物)
#   - /api/* 反代 uvicorn (127.0.0.1:8000)
#   - /ws/*  反代 WebSocket
#   - /healthz 直通后端健康检查
#   - SPA fallback: try_files -> /index.html
#   - 静态资源 (带 hash) 一年强缓存; index.html 禁用缓存
#   - 开启 gzip (html/js/css/json/svg)
#
# 部署步骤见 docs/DEPLOYMENT.md

upstream stock_analysis_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /home/xiaotian/stock_analysis/frontend/dist;
    index index.html;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript
               application/javascript application/json application/xml
               image/svg+xml;

    # ---- REST API ----
    location /api/ {
        proxy_pass http://stock_analysis_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # ---- WebSocket (盘中推送) ----
    location /ws/ {
        proxy_pass http://stock_analysis_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ---- 健康检查 ----
    location = /healthz {
        proxy_pass http://stock_analysis_api;
        access_log off;
    }

    # ---- 静态资源 (vite 输出带 content hash, 可长期强缓存) ----
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- SPA fallback ----
    # 其他路径全部回落 index.html, 由 vue-router history 模式接管
    # index.html 本身不缓存, 保证部署即生效
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 客户端上传限制 (避免误上传大文件) ----
    client_max_body_size 8m;

    access_log /var/log/nginx/stock_analysis.access.log;
    error_log  /var/log/nginx/stock_analysis.error.log;
}
