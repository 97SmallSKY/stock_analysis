services:
  postgres:
    image: postgres:15-alpine
    container_name: lhb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lhb_admin
      POSTGRES_PASSWORD: lhb_quant_2024
      POSTGRES_DB: lhb_quant
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lhb_admin -d lhb_quant"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    shm_size: 512m
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2560M
        reservations:
          cpus: "0.5"
          memory: 512M

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: lhb-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lhb-quant.com
      PGADMIN_DEFAULT_PASSWORD: admin123456
      PGADMIN_LISTEN_PORT: 80
      TZ: Asia/Shanghai
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_started

volumes:
  pgdata:
    name: lhb_pgdata
  pgadmin_data:
    name: lhb_pgadmin_data
