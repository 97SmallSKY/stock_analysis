[program:sim_monitor]
command=/root/miniconda3/bin/python -c "from engine.live.realtime_monitor import start_monitor; start_monitor()"
directory=/root/stock_analysis
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/root/stock_analysis/logs/monitor.log
stderr_logfile=/root/stock_analysis/logs/monitor_err.log
user=root
environment=PYTHONPATH="/root/stock_analysis"
