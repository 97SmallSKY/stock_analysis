[pytest]
# W11-3: 覆盖率门槛 70%
# 集成测试 test_db_crud / test_data_fetch 依赖真实 PostgreSQL + AKShare 外网,
# CI 不跑, 通过 --ignore 排除; 本地需要时显式 pytest tests/test_db_crud.py 跑.
addopts =
    --strict-markers
    --ignore=tests/test_db_crud.py
    --ignore=tests/test_data_fetch.py
    --cov=backend
    --cov-report=term-missing:skip-covered
    --cov-fail-under=70

testpaths = tests

markers =
    integration: 集成测试, 需真 DB / 外网
