[pytest]
asyncio_mode = auto
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 覆盖率配置（可选）
addopts = 
    --strict-markers
    --tb=short
    -ra

# 标记定义
markers =
    asyncio: 异步测试
    integration: 集成测试
    slow: 慢速测试
