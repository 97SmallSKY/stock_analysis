# ============================================================
# db/conf/postgresql.conf
#
# PostgreSQL 15 性能优化
# 目标机器: CentOS 8.2 | 2核CPU | 4GB RAM | SSD
#
# 核心思路:
#   - 内存紧张 → 精打细算每一个buffer
#   - CPU有限 → 限制并行度
#   - SSD     → 降低random_page_cost
#   - 量化特征 → 大量批量写入 + 复杂聚合查询
# ============================================================

# ====================
# 连接
# ====================
listen_addresses = '*'
port = 5432
max_connections = 50                         # 2核4G不宜过多连接
superuser_reserved_connections = 3

# ====================
# 内存 (最关键，4GB总内存，PG可用约2.5GB)
# ====================

# 共享缓冲区: 物理内存的 25% → 4G * 0.25 = 1G
shared_buffers = 1GB

# 单次排序/哈希内存
# 50连接 * 8MB = 400MB 峰值，可控
work_mem = 8MB

# VACUUM / CREATE INDEX 用的内存
maintenance_work_mem = 256MB

# 临时缓冲区
temp_buffers = 16MB

# OS+PG总缓存估算: 物理内存的 60% → 4G * 0.6 = 2.4G
effective_cache_size = 2400MB

# huge_pages: 小内存环境关闭，避免分配失败
huge_pages = off

# ====================
# WAL 写前日志
# ====================
wal_level = replica
wal_buffers = 32MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# WAL大小: 小磁盘控制WAL增长
max_wal_size = 2GB
min_wal_size = 512MB

full_page_writes = on

# WAL压缩: 减少磁盘IO(CPU换空间，2核够用)
wal_compression = on

# ====================
# 查询优化器
# ====================

# SSD: 随机读接近顺序读
random_page_cost = 1.1
seq_page_cost = 1.0

# SSD并发IO
effective_io_concurrency = 200

# 并行查询: 2核CPU → 保守设置
max_worker_processes = 4
max_parallel_workers_per_gather = 1          # 每次查询最多1个并行worker
max_parallel_workers = 2                     # 全局最多2个并行worker
max_parallel_maintenance_workers = 1         # 维护操作1个并行worker
parallel_tuple_cost = 0.01
parallel_setup_cost = 1000

# 统计信息精度(提升执行计划准确性)
default_statistics_target = 100

# JIT: 小机器关闭，编译开销>收益
jit = off

# ====================
# 后台写进程
# ====================
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after = 256kB

# ====================
# 自动 VACUUM
# 量化数据特征: 大量INSERT少UPDATE → 适度放宽触发条件
# ====================
autovacuum = on
autovacuum_max_workers = 2                   # 2核CPU只开2个worker
autovacuum_naptime = 60s                     # 检查间隔60秒(默认1min)

# 触发阈值: 比默认更积极但不过分
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1         # 表数据变化10%触发(默认20%)
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05       # 表数据变化5%触发(默认10%)

# vacuum IO节流: 避免vacuum抢占查询IO
autovacuum_vacuum_cost_delay = 10ms          # 每轮vacuum暂停10ms
autovacuum_vacuum_cost_limit = 500           # 每轮vacuum成本上限

# ====================
# 日志
# ====================
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 50MB
log_truncate_on_rotation = on

# 慢查询: 记录超过1秒的SQL
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0

log_line_prefix = '%t [%p-%l] %q%u@%d '
log_statement = 'ddl'
log_timezone = 'Asia/Shanghai'

# ====================
# 锁与超时
# ====================
deadlock_timeout = 1s
lock_timeout = 30s
statement_timeout = 180s                     # 小机器限制3分钟
idle_in_transaction_session_timeout = 300s   # 空闲事务5分钟超时

# ====================
# 扩展模块
# ====================
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 2000
pg_stat_statements.track = top
pg_stat_statements.track_utility = off       # 小机器不追踪工具语句
pg_stat_statements.save = on

# ====================
# 区域与时区
# ====================
timezone = 'Asia/Shanghai'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.simple'

# ====================
# 安全
# ====================
password_encryption = scram-sha-256
ssl = off                                    # 内网环境关闭
